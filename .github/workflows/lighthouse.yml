name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse budget check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        # Pinned explicitly (not the treosh/lighthouse-ci-action wrapper) so CI runs the
        # exact same Lighthouse/axe-core version verified locally with `npx @lhci/cli@0.14.x
        # autorun` — a version drift here previously produced a CI-only false positive
        # (an aria-hidden decorative element flagged for color-contrast, which the pinned
        # version correctly excludes).
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.json
